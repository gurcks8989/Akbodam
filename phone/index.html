<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>악보담 · 악보 보내기</title><link rel="stylesheet" href="/style.css"></head><body><main><small>AKBODAM</small><h1>악보 보내기</h1><p>같은 Wi-Fi에 연결된 악보담으로<br>사진이나 PDF를 보내세요.</p><p id="connection" role="status">연결 확인 중…</p><form id="upload-form"><label for="files">사진 · PDF 선택</label><input id="files" type="file" accept=".pdf,.jpg,.jpeg,.png,image/jpeg,image/png,application/pdf" multiple disabled><p class="hint">파일당 50MB · 한 번에 10개까지<br>카카오톡 파일은 휴대폰에 저장한 뒤 선택하세요.</p><button id="send" disabled>악보 보내기</button></form><progress id="progress" max="100" value="0" hidden></progress><ul id="results" aria-live="polite"></ul><p class="hint">받은 악보는 악보담 보관함에 저장됩니다.<br>완전히 같은 파일은 중복 저장하지 않습니다.</p></main><script src="/upload.js" defer></script></body></html>
